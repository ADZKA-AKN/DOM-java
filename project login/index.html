<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-80 ">
        <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
        <!-- username -->
        <form id="loginform">
            <div class="mb-4">
                <label class="block text-gray-700" >Username</label>
                <input type="text" id="username" class="w-full mt-1 p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Masukan Username...">
            </div>

            <!-- password -->
            <div class="mb-4">
                <label class="block text-gray-700" >Password</label>
                <input type="password" id="password" class="w-full mt-1 p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Masukan Password...">
            </div>

            <!-- button -->
            <button type="submit" class=" py-2 px-6 bg-blue-800 text-white rounded-lg hover:bg-blue-500 w-65 mt-3">Login</button>
            
        </form>
            <!-- output -->
            <p id="msg" class="text-center mt-4 text-sm"></p>
    </div>


    <script src="main.js"></script>
</body>
</html>
